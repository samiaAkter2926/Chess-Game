<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="chess">

        <!-- First row: Black pieces -->
        <div class="row">
            <div class="square">&#9820;</div>
            <div class="square">&#9822;</div>
            <div class="square">&#9821;</div>
            <div class="square">&#9819;</div>
            <div class="square">&#9818;</div>
            <div class="square">&#9821;</div>
            <div class="square">&#9822;</div>
            <div class="square">&#9820;</div>
        </div>

        <!-- Second row: Black pawns -->
        <div class="row">
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
            <div class="square">&#9823;</div>
        </div>

        <!-- Third row -->
        <div class="row">
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
        </div>

        <!-- Fourth row -->
        <div class="row">
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
        </div>

        <!-- Fifth row -->
        <div class="row">
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
        </div>

        <!-- Sixth row -->
        <div class="row">
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div>
        </div>

        <!-- Seventh row: White pawns -->
        <div class="row">
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
            <div class="square">&#9817;</div>
        </div>

        <!-- Eighth row: White pieces -->
        <div class="row">
            <div class="square">&#9814;</div>
            <div class="square">&#9816;</div>
            <div class="square">&#9815;</div>
            <div class="square">&#9813;</div>
            <div class="square">&#9812;</div>
            <div class="square">&#9815;</div>
            <div class="square">&#9816;</div>
            <div class="square">&#9814;</div>
        </div>

    </div>

</body>
</html>
